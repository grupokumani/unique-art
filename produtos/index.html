<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorias — UniqueArt</title>
  <meta name="description" content="Explora todas as categorias de produtos personalizados da UniqueArt: Shadow Box, Encanto Box, LetterBox, Bouquets, Chaveiros, Camisetas, Papelaria e Doces.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/home.css">
</head>
<body>

  <div data-include="header"></div>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-heading">
          <span class="badge badge--gold">Categorias</span>
          <h1>O nosso mundo de personalização</h1>
          <p class="text-muted">Escolhe uma categoria para veres os produtos disponíveis.</p>
        </div>

        <div class="category-grid">
          <a href="/produtos/caixa-personalizada.html" class="category-card">
            <img src="/assets/images/categories/caixa-personalizada.jpg" alt="Caixa personalizada">
            <div class="category-card__overlay"></div>
            <span class="category-card__label">Caixas Personalizadas</span>
          </a>
          <a href="/produtos/frascos.html" class="category-card">
            <img src="/assets/images/categories/frascos.jpg" alt="Recipientes Personalizados">
            <div class="category-card__overlay"></div>
            <span class="category-card__label">Recipientes Personalizados</span>
          </a>
          <a href="/produtos/quadros-personalisados.html" class="category-card">
            <img src="/assets/images/categories/quadros-personalizados.jpg" alt="Quadros Personalizados">
            <div class="category-card__overlay"></div>
            <span class="category-card__label">Quadros Personalizados</span>
          </a>
          <a href="/produtos/bouquets.html" class="category-card">
            <img src="/assets/images/categories/bouquets.jpg" alt="Bouquets personalizados">
            <div class="category-card__overlay"></div>
            <span class="category-card__label">Bouquets</span>
          </a>
          <a href="/produtos/chaveiros-acrilico.html" class="category-card">
            <img src="/assets/images/categories/chaveiros-acrilico.jpg" alt="Chaveiros de acrílico">
            <div class="category-card__overlay"></div>
            <span class="category-card__label">Chaveiros &amp; Acrílico</span>
          </a>
          <a href="/produtos/camisetas-personalizadas.html" class="category-card">
            <img src="/assets/images/categories/estampagem.jpg" alt="Camisetas personalizadas">
            <div class="category-card__overlay"></div>
            <span class="category-card__label">Camisetas</span>
          </a>
          <a href="/produtos/papelaria.html" class="category-card">
            <img src="/assets/images/categories/papelaria.jpg" alt="Papelaria personalizada">
            <div class="category-card__overlay"></div>
            <span class="category-card__label">Papelaria</span>
          </a>
          <a href="/produtos/brindes.html" class="category-card">
            <img src="/assets/images/categories/brindes.jpg" alt="Brindes personalizados">
            <div class="category-card__overlay"></div>
            <span class="category-card__label">Brindes Personalizados</span>
          </a>
        </div>
      </div>
    </section>

  <div data-include="footer"></div>

  <script src="/assets/js/products-data.js"></script>
  <script src="/assets/js/cart.js"></script>
  <script src="/assets/js/include.js"></script>
  <script src="/assets/js/main.js"></script>
