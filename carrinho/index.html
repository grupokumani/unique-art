<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho — UniqueArt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/home.css">
  <link rel="stylesheet" href="/assets/css/shop.css">
  <link rel="stylesheet" href="/assets/css/cart.css">
</head>
<body>

  <div data-include="header"></div>

  <main class="section">
    <div class="container">
      <div class="section-heading" style="margin-bottom: var(--space-8);">
        <span class="badge">Carrinho</span>
        <h1>O teu carrinho</h1>
      </div>

      <div class="cart-empty" data-cart-empty style="display:none;">
        <p class="text-muted">O teu carrinho está vazio.</p>
        <a href="/loja/" class="btn btn--primary" style="margin-top: var(--space-6);">Ver Catálogo</a>
      </div>

      <div class="cart-layout">
        <div data-cart-list></div>
        <aside class="cart-summary" data-cart-summary></aside>
      </div>
    </div>
  </main>

  <div data-include="footer"></div>

  <script src="/assets/js/products-data.js"></script>
  <script src="/assets/js/cart.js"></script>
  <script src="/assets/js/cart-page.js"></script>
  <script src="/assets/js/include.js"></script>
  <script src="/assets/js/main.js"></script>
</body>
</html>
